name: Validate website

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve pinned Hugo module
        run: hugo mod graph

      - name: Validate source contracts
        run: python3 scripts/validate.py

      - name: Test Cloudflare edge behavior
        run: node --test tests/edge-worker.test.mjs

      - name: Build immutable production-canonical candidate
        run: python3 scripts/build.py

      - name: Verify release candidate
        run: python3 scripts/verify_dist.py

      - name: Save exact main release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: website-release-candidate
          path: dist/
          retention-days: 14
          include-hidden-files: true
