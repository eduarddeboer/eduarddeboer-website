name: One-off sync podcast KG projection

on:
  push:
    paths:
      - ".github/workflows/oneoff-sync-podcast-kg-projection.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted website main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch exact production KG handoff
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/kg-site-snapshot.json https://data.eduarddeboer.com/site-snapshot.json
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/kg-release-manifest.json https://data.eduarddeboer.com/release-manifest.json
          python3 - <<'PY'
          import json
          snapshot=json.load(open("/tmp/kg-site-snapshot.json", encoding="utf-8"))
          manifest=json.load(open("/tmp/kg-release-manifest.json", encoding="utf-8"))
          source=snapshot.get("source", {})
          if source.get("commit") != "794319608f742a36ccb18202fe412aa0b7f5187b":
              raise SystemExit(f"Unexpected production KG commit: {source.get('commit')}")
          if manifest.get("commit_sha") != source.get("commit"):
              raise SystemExit("Production release manifest and site snapshot do not pin the same commit")
          entities=snapshot.get("entities", {})
          if "podcast_episode/reputatiecoaching_001" not in entities:
              raise SystemExit("Podcast 001 is missing from production website projection")
          if "podcast_episode/reputatiecoaching_167" not in entities:
              raise SystemExit("Podcast 167 is missing from production website projection")
          print("Verified production projection with", len(entities), "entities")
          PY

      - name: Compare semantic projection
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_kg_projection.py             /tmp/kg-site-snapshot.json             /tmp/kg-release-manifest.json             --status-json /tmp/kg-sync-status.json
          python3 - /tmp/kg-sync-status.json >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          status=json.load(open(sys.argv[1], encoding="utf-8"))
          print("changed=" + ("true" if status["changed"] else "false"))
          print("candidate_commit=" + status["candidate_commit"])
          print("candidate_digest=" + status["candidate_semantic_sha256"])
          PY

      - name: Prepare stable sync branch
        if: steps.compare.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="bridge/kg-projection-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Apply validated production projection
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_kg_projection.py             /tmp/kg-site-snapshot.json             /tmp/kg-release-manifest.json             --apply             --status-json /tmp/kg-sync-applied.json
          python3 scripts/validate.py
          python3 tests/test_kg_projection_sync.py
          git add -- data/kg/snapshot.json data/kg/sections.json
          if git diff --cached --quiet; then
            echo "No projection file changes to commit"
          else
            git commit -m "data: refresh podcast KG website projection"
            git push -u origin "${{ steps.branch.outputs.name }}"
          fi

      - name: Open or refresh website snapshot PR
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
          KG_COMMIT: ${{ steps.compare.outputs.candidate_commit }}
          KG_DIGEST: ${{ steps.compare.outputs.candidate_digest }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.SYNC_BRANCH;
            const title = "Sync production KG website projection";
            const body = [
              "## Automated KG projection refresh",
              "",
              "Production KG commit: " + process.env.KG_COMMIT,
              "Semantic projection SHA-256: " + process.env.KG_DIGEST,
              "",
              "Includes the reviewed ReputatieCoaching PodcastEpisode projection and one-hop relation closure from KG PR #119.",
              "",
              "**This PR is never auto-merged by the sync itself.**",
            ].join("\n");
            const existing = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", head: owner + ":" + branch, base: "main", per_page: 100,
            });
            if (existing.length) {
              await github.rest.pulls.update({owner, repo, pull_number: existing[0].number, title, body});
              core.notice("Updated website sync PR #" + existing[0].number);
            } else {
              const created = await github.rest.pulls.create({owner, repo, title, head: branch, base: "main", body});
              core.notice("Opened website sync PR #" + created.data.number);
            }
