name: One-off sync podcast KG projection

on:
  push:
    paths:
      - ".github/workflows/oneoff-sync-podcast-kg-projection.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch exact production KG handoff
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/kg-site-snapshot.json https://data.eduarddeboer.com/site-snapshot.json
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/kg-release-manifest.json https://data.eduarddeboer.com/release-manifest.json

      - name: Prepare stable sync branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B bridge/kg-projection-sync origin/main

      - name: Apply validated production projection
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_kg_projection.py /tmp/kg-site-snapshot.json /tmp/kg-release-manifest.json --apply --status-json /tmp/kg-sync-applied.json
          python3 scripts/validate.py
          python3 tests/test_kg_projection_sync.py
          git add -- data/kg/snapshot.json data/kg/sections.json
          if git diff --cached --quiet; then
            echo "No semantic projection change."
          else
            git commit -m "data: refresh KG website projection"
            git push --force-with-lease origin bridge/kg-projection-sync
          fi
