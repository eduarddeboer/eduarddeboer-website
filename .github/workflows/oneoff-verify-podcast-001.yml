name: One-off verify podcast 001

on:
  push:
    paths:
      - ".github/workflows/oneoff-verify-podcast-001.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify rendered podcast 001
        shell: bash
        run: |
          set -euo pipefail
          URL="https://staging.eduarddeboer-website-preview.pages.dev/nl/archief/reputatiecoaching/001/"
          curl -sSL --retry 5 --retry-delay 2 -D /tmp/headers.txt -w '%{http_code} %{url_effective}\n' "$URL" -o /tmp/podcast001.html | tee /tmp/curl-result.txt
          echo "=== HEADERS ==="
          cat /tmp/headers.txt
          echo "=== TITLE ==="
          grep -oi '<title[^>]*>.*</title>' /tmp/podcast001.html | head -n 3 || true
          echo "=== SCRIPT TAGS ==="
          grep -oi '<script[^>]*>' /tmp/podcast001.html | head -n 30 || true
          echo "=== KG TOKENS ==="
          grep -o 'podcast_episode/reputatiecoaching_001\|application/ld+json\|PodcastEpisode' /tmp/podcast001.html | sort -u || true
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path

          text = Path("/tmp/podcast001.html").read_text(encoding="utf-8")
          scripts = re.findall(
              r'<script[^>]+type\s*=\s*(?:"application/ld\+json"|\'application/ld\+json\'|application/ld\+json)[^>]*>(.*?)</script>',
              text,
              flags=re.I | re.S,
          )
          if not scripts:
              raise SystemExit("No JSON-LD found")

          nodes = []
          for raw in scripts:
              data = json.loads(html.unescape(raw.strip()))
              if isinstance(data, dict) and isinstance(data.get("@graph"), list):
                  nodes.extend(data["@graph"])
              elif isinstance(data, dict):
                  nodes.append(data)

          episode_id = "https://data.eduarddeboer.com/entity/podcast_episode/reputatiecoaching_001"
          episode = next((n for n in nodes if n.get("@id") == episode_id), None)
          if not episode:
              raise SystemExit("PodcastEpisode KG node missing")
          if episode.get("@type") != "PodcastEpisode":
              raise SystemExit(f"Unexpected episode type: {episode.get('@type')!r}")
          if str(episode.get("episodeNumber")) != "001":
              raise SystemExit(f"Unexpected episodeNumber: {episode.get('episodeNumber')!r}")

          media = episode.get("associatedMedia") or {}
          expected_audio = "https://archive.org/download/20121203-reputatie-coaching-podcast-001/20121203-ReputatieCoaching-Podcast-001.mp3"
          if media.get("@type") != "AudioObject" or media.get("contentUrl") != expected_audio:
              raise SystemExit("Podcast audio metadata missing or incorrect")

          rel_ids = {}
          for predicate in ("author", "isPartOf", "about", "mentions"):
              value = episode.get(predicate, [])
              if isinstance(value, dict):
                  value = [value]
              rel_ids[predicate] = {item.get("@id") for item in value if isinstance(item, dict)}

          expected = {
              "author": {"https://eduarddeboer.com/#person"},
              "isPartOf": {"https://data.eduarddeboer.com/entity/podcast_series/reputatiecoaching_podcast"},
              "about": {
                  "https://data.eduarddeboer.com/entity/defined_term/online_reputation_management",
                  "https://data.eduarddeboer.com/entity/defined_term/search_engine_optimization",
              },
              "mentions": {"https://data.eduarddeboer.com/entity/software_application/wordpress"},
          }
          for predicate, wanted in expected.items():
              missing = wanted - rel_ids[predicate]
              if missing:
                  raise SystemExit(f"Missing {predicate} relations: {sorted(missing)}")

          wayback = [
              "https://web.archive.org/web/20121203000026/http://www.reputatiecoaching.nl/over-de-reputatiecoaching-podcast/",
              "https://web.archive.org/web/20121203220056/http://www.reputatiecoaching.nl/reputatie/",
              "https://web.archive.org/web/20121203020017/http://www.reputatiecoaching.nl/wordpress-3-5-komt-eraan/",
          ]
          for url in wayback:
              if url not in text and html.escape(url, quote=True) not in text:
                  raise SystemExit(f"Wayback link missing: {url}")

          print("Podcast 001 JSON-LD and Wayback links verified.")
          PY
