name: Restore recoverable podcast links

on:
  push:
    branches:
      - fix/podcast-recovered-links-media
    paths:
      - scripts/restore_recoverable_podcast_links.py

permissions:
  contents: write

concurrency:
  group: restore-recoverable-podcast-links
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore links and image markup
        run: python3 scripts/restore_recoverable_podcast_links.py

      - name: Validate source contracts
        run: python3 scripts/validate.py

      - name: Commit restored podcast references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/nl/archief/reputatiecoaching
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "Restore recoverable podcast links"
          git push origin "HEAD:${{ github.ref_name }}"
