name: Audit podcast Wayback second pass

on:
  push:
    branches:
      - analysis/podcast-wayback-second-pass
    paths:
      - scripts/audit_reputatiecoaching_wayback_second_pass.py
      - .github/workflows/audit-podcast-wayback-second-pass.yml

permissions:
  contents: write

concurrency:
  group: podcast-wayback-second-pass
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run second-pass audit
        run: |
          python3 scripts/audit_reputatiecoaching_wayback_second_pass.py \
            --output data/archive/link-repair/second-pass-wayback-audit.json

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/link-repair/second-pass-wayback-audit.json
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Report second-pass podcast Wayback audit"
          git push origin "HEAD:${{ github.ref_name }}"
