{{- $src := .Get "src" -}}
{{- $title := .Get "title" | default "Audio" -}}
{{- if not $src }}{{ errorf "audio shortcode requires src on %s" .Page.File.Path }}{{ end -}}
<figure class="privacy-media rc-audio-launcher">
  <div class="podcast-player" data-podcast-player>
    <button
      class="podcast-launch podcast-launch--hero"
      type="button"
      data-podcast-launch
      data-audio-src="{{ $src | safeURL }}"
      data-audio-label="{{ $title }}"
      aria-label="{{ $title }}"
    >
      <span class="podcast-launch__icon" aria-hidden="true">▶</span>
      <span>Afspelen</span>
    </button>
  </div>
  <figcaption>{{ $title }} · audio wordt pas na een klik vanaf Archive.org geladen</figcaption>
  <noscript><p><a href="{{ $src | safeURL }}" rel="external">MP3 op Archive.org openen</a></p></noscript>
</figure>
<script src="{{ "/js/podcast.js" | relURL }}" defer></script>
